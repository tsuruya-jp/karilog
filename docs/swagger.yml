          type: string
          format: password
          description: 現在のパスワード（パスワード変更時に必須）
          example: SecurePass123!
        new_password:
          type: string
          format: password
          minLength: 8
          maxLength: 100
          description: 新しいパスワード（8文字以上）
          example: NewPassword789!

    DeleteUserRequest:
      type: object
      required:
        - password
      properties:
        password:
          type: string
          format: password
          description: 現在のパスワード（確認用）
