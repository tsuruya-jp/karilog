      operationId: createHuntingRecord
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHuntingRecordRequest'
            example:
              hunting_date: '2025-01-20'
              location: 〇〇県△△山
              is_planned: false
              notes: イノシシ狩猟
      responses:
        '201':
          description: 出猟記録登録成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HuntingRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

