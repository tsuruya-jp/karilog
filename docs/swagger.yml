          description: 年でフィルタリング
          schema:
            type: integer
        - name: month
          in: query
          description: 月でフィルタリング（yearと併用）
          schema:
            type: integer
            minimum: 1
            maximum: 12
        - name: from_date
          in: query
          description: 開始日（この日以降）
          schema:
            type: string
            format: date
        - name: to_date
          in: query
          description: 終了日（この日以前）
          schema:
            type: string
            format: date
        - name: is_planned
          in: query
          description: 予定/実績でフィルタリング
          schema:
            type: boolean
        - name: page
          in: query
          description: ページ番号
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          description: 1ページあたりの件数
          schema:
