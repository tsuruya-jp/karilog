components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT認証。ログインで取得したアクセストークンを使用します。

        **トークン有効期限:**
        - アクセストークン: 1時間
        - リフレッシュトークン: 30日

  schemas:
    # ============================================================
    # Request Schemas
    # ============================================================

    RegisterRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          description: メールアドレス
          example: hunter@example.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 100
          description: |
            パスワード（8文字以上、英数字混合推奨）
          example: SecurePass123!
        name:
          type: string
          maxLength: 100
          description: ユーザー名
          example: 山田太郎

    VerifyEmailRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: メール確認トークン（確認メールに含まれる）
          example: verification-token-from-email

    ResendVerificationRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          description: 登録済みメールアドレス
          example: hunter@example.com

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: メールアドレス
          example: hunter@example.com
        password:
          type: string
          format: password
          description: パスワード
          example: SecurePass123!

    RefreshTokenRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          description: リフレッシュトークン
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          description: 登録済みメールアドレス
          example: hunter@example.com

    ResetPasswordRequest:
      type: object
      required:
        - token
        - password
      properties:
        token:
          type: string
          description: パスワードリセットトークン（リセットメールに含まれる）
          example: reset-token-from-email
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 100
          description: 新しいパスワード（8文字以上）
          example: NewSecurePass456!

    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          description: ユーザー名
          example: 山田太郎（更新）
